[Network]
agv_host=192.168.1.88
agv_port=502

[Polling]
agv_poll_ms=200
agv_reconnect_ms=5000
main_modbus_poll_ms=500
main_reconnect_ms=5000
main_ui_poll_ms=200

[Auth]
; 推荐通过环境变量注入：AGV_ADMIN_PASSWORD_HASH / AGV_ENGINEER_PASSWORD_HASH / AGV_MANUFACTURER_PASSWORD_HASH
; 兼容配置文件注入：可写 sha256:前缀，或直接写64位SHA-256十六进制串
admin_password_hash=
engineer_password_hash=
manufacturer_password_hash=

[OperationLogTransport]
; 推荐优先用环境变量覆盖：AGV_LOG_TLS / AGV_LOG_ALLOWED_HOSTS / AGV_LOG_SIGNING_KEY / AGV_LOG_TLS_CA_FILE
tls_enabled=true
allowed_hosts=127.0.0.1,192.168.1.70
signing_key=
tls_ca_file=

[SliderLabelLimits]
label_Value1_max=170
label_Value1_min=-170
label_Value2_max=1150
label_Value2_min=-850
label_Value3_max=840
label_Value3_min=0
label_Value4_max=180
label_Value4_min=-180
