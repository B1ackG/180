[; feature_switches.ini - 功能开关配置文件（带中文说明）]
; 说明：
; - 配置分为三部分：Master（总开关）、BigFeatures（大功能组）和 SmallFeatures（小功能项）。
; - 修改后通常需要重启应用生效，或者在运行时调用 FeatureSwitchManager::instance()->reload() 重新加载。
; - 对于小功能，通常依赖对应的大功能开启；若某项未在已知列表中，程序默认视其为启用（不会阻塞未知项）。

[Master]
; 总开关：false 则所有功能均不可用（谨慎使用）
enabled=true

[BigFeatures]
; 大功能用于粗粒度的功能分组，关闭某个大功能将影响该组下的所有小功能。
; startup_checks    = 启动时是否执行系统自检（例如伺服清报警、寄存器写入等）
startup_checks=true
; ui_navigation     = 是否启用 UI 导航与页面切换
ui_navigation=true
; permission_system = 权限体系（登录/管理员权限等）
permission_system=true
; operation_records = 操作记录/历史记录功能
operation_records=true
; tcp_transmission  = 网络/TCP 传输（远程工具/上报）
tcp_transmission=true
; modbus_main       = 主控 Modbus 通信（非 AGV）
modbus_main=true
; modbus_agv        = AGV 专用 Modbus 通信
modbus_agv=true
; motion_control    = 运动控制相关（速度、步进、转向等）
motion_control=true
; input_devices     = 输入设备（矩阵键、使能按钮等）
input_devices=true
; force_sensor      = 力传感/力控相关
force_sensor=true
; alarm_system      = 报警系统（急停/力控报警/弹窗显示等）
alarm_system=true

[SmallFeatures]
; 小功能用于更细粒度控制，名称通常采用 模块.子项 的形式
; startup.clear_servo_alarm = 启动时是否尝试清除伺服报警
startup.clear_servo_alarm=true
; startup.write_registers   = 启动时是否写入初始化寄存器
startup.write_registers=true
; startup.log_report        = 启动时是否记录启动报告
startup.log_report=true

; ui.styles                 = 是否应用自定义 UI 样式表
ui.styles=true
; ui.animations             = 是否开启界面动画效果
ui.animations=true
; ui.virtual_keyboard       = 是否启用虚拟键盘（触摸屏）
ui.virtual_keyboard=true

; permission.admin_login    = 是否启用管理员登录逻辑（界面内切换权限）
permission.admin_login=true

; records.filter_export     = 是否允许导出/筛选记录
records.filter_export=true

; tcp.send_all              = 是否通过 TCP 发送所有监测数据（调试用）
tcp.send_all=true

; modbus_main.polling       = 主控 Modbus 是否轮询（读寄存器）
modbus_main.polling=true
; modbus_main.float_reading = 是否以浮点解析某些 Modbus 数据
modbus_main.float_reading=true

; agv.fault_codes           = 是否显示/上报 AGV 故障码
agv.fault_codes=true
; agv.speed_gauge           = 是否显示 AGV 速度表
agv.speed_gauge=true

; motion.steering_mode      = 转向模式功能
motion.steering_mode=true
; motion.speed_mode         = 速度模式（巡航/手动/步进）
motion.speed_mode=true
; motion.step_mode          = 步进/点动控制
motion.step_mode=true
; motion.force_control      = 运动时力控功能（启用力传感参与控制）
motion.force_control=true

; input.matrix_key          = 矩阵键是否启用
input.matrix_key=true
; input.enable_button       = 使能按钮是否启用
input.enable_button=true

; force.big_sensor          = 是否启用大传感器读取
force.big_sensor=true
; force.small_sensor        = 是否启用小传感器读取
force.small_sensor=true
; force.clear_zero          = 是否允许清零力传感器
force.clear_zero=true

; 报警相关小功能说明：
; alarm.emergency_stop = 立柱/底盘急停（若关闭则忽略急停来源）
alarm.emergency_stop=true
; alarm.force_limit    = 力控超限报警（如限位/力控触发）
alarm.force_limit=true
; alarm.steering_switch = 转向模式切换时的状态提示报警
alarm.steering_switch=true
; alarm.popup          = 是否以弹窗形式展示报警信息
alarm.popup=true

; 使用示例：
; 1) 仅关闭力控超限报警（不影响其他报警）：
;    在 [SmallFeatures] 下将 alarm.force_limit=false，保存并重启应用或调用 reload()
; 2) 临时关闭整个报警系统（所有报警均不生效）：
;    在 [BigFeatures] 下将 alarm_system=false
; 3) 在代码中程序化关闭并保存：
;    FeatureSwitchManager::instance()->setSmallFeatureEnabled("alarm.force_limit", false);
;    FeatureSwitchManager::instance()->save();

; 注意：某些开关在关闭后可能会影响其他功能（例如关闭 modbus_main 可能导致依赖其数据的 UI 不更新），
; 在修改前请评估依赖关系，或仅在测试环境/调试时进行调整。
